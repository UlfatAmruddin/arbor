# Pushing a tag such as v0.3.0 builds the universal app, makes the disk image, signs and notarizes
# it when the signing secrets are set, and attaches it to a draft GitHub Release.
# See docs/RELEASING.md for the secrets and the full checklist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: macos-26   # Xcode 26 toolchain, the same Swift the project is developed with
    timeout-minutes: 90
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history: the build number is the commit count

      - name: Check that the tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($expected)"
            exit 1
          fi

      - name: Unit tests
        run: scripts/test.sh

      - name: Build universal app
        run: scripts/build-app.sh release --universal

      - name: Import Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          scripts/ci-import-certificate.sh "$RUNNER_TEMP/certificate.p12"

      - name: Sign, package and notarize
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-and-notarize.sh

      - name: Checksum
        run: |
          cd build
          shasum -a 256 Arbor-*.dmg | tee "Arbor-${GITHUB_REF_NAME#v}.dmg.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          if [ "$HAS_CERTIFICATE" = "true" ]; then
            echo "Signed with a Developer ID and notarized by Apple." > "$notes"
          else
            {
              echo "**First launch:** this build isn't signed with an Apple Developer ID, so macOS blocks it the first time."
              echo "Open Arbor once, then go to System Settings → Privacy & Security and click **Open Anyway**."
              echo "On macOS 14 you can instead Control-click Arbor in Applications and choose **Open**."
            } > "$notes"
          fi
          # This version's section of CHANGELOG.md.
          { echo; awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md; } >> "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "build/Arbor-$version.dmg" "build/Arbor-$version.dmg.sha256" \
            --draft --title "Arbor $version" --notes-file "$notes"

      - name: Remove signing keychain
        if: always() && env.HAS_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
