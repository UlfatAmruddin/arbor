# Pushing a tag such as v0.3.0 builds the universal app, makes the disk image, signs and notarizes
# it when the signing secrets are set, and attaches it to a draft GitHub Release. When the
# SPARKLE_ED_PRIVATE_KEY secret and the SPARKLE_ED_PUBLIC_KEY variable are set, the app gets an
# update feed and the release gets the in-app update: a signed zip and appcast.xml (FE-259).
# See docs/RELEASING.md for the secrets and the full checklist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release

# One release run per tag at a time; a second push waits instead of making a second draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26   # Xcode 26 toolchain, the same Swift the project is developed with
    timeout-minutes: 90
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
      HAS_UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
      UPDATE_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}   # not secret: it ships in every app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history: the build number is the commit count
          persist-credentials: false   # no step needs the token in .git/config; gh uses GH_TOKEN

      - name: Check the tag, VERSION, CHANGELOG and existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($expected)"
            exit 1
          fi
          # The release notes and the update feed are this version's CHANGELOG section; fail now, not after the build.
          if ! grep -qxF "## ${GITHUB_REF_NAME#v}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## ${GITHUB_REF_NAME#v}'"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists; delete that draft before running again"
            exit 1
          fi

      - name: Check the update keys
        run: |
          if [ "$HAS_UPDATE_KEY" = "true" ] && [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is set but the SPARKLE_ED_PUBLIC_KEY variable is not (docs/RELEASING.md)"
            exit 1
          fi
          if [ "$HAS_UPDATE_KEY" != "true" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error::SPARKLE_ED_PUBLIC_KEY is set but the SPARKLE_ED_PRIVATE_KEY secret is not (docs/RELEASING.md)"
            exit 1
          fi

      - name: Unit tests
        run: scripts/test.sh

      - name: Build universal app
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # The feed is this repository's latest published release, so drafts never reach testers.
          if [ "$HAS_UPDATE_KEY" = "true" ]; then
            export ARBOR_UPDATE_FEED_URL="https://github.com/$REPOSITORY/releases/latest/download/appcast.xml"
            export ARBOR_UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY"
          fi
          scripts/build-app.sh release --universal

      - name: Check the build number goes up
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sparkle offers an update only when its build number is higher. The build number is the commit
          # count, so rewriting the public history would lower it and silently stop every update.
          current="$(plutil -extract CFBundleVersion raw build/Arbor.app/Contents/Info.plist)"
          previous_dir="$RUNNER_TEMP/previous-feed"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$previous_dir" 2>/dev/null; then
            previous="$(sed -nE 's#.*<sparkle:version>([0-9]+)</sparkle:version>.*#\1#p' "$previous_dir/appcast.xml" | head -n 1)"
            if [ -z "$previous" ] || [ "$current" -le "$previous" ]; then
              echo "::error::Build $current is not above the latest release's build ${previous:-(unreadable)}; installed copies would never update"
              exit 1
            fi
            echo "Build $current follows build $previous"
          else
            echo "::notice::The latest release has no update feed; build $current is the first"
          fi

      - name: Import Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          scripts/ci-import-certificate.sh "$RUNNER_TEMP/certificate.p12"

      - name: Sign, package and notarize
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-and-notarize.sh

      - name: In-app update (signed zip and feed)
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The key goes in on standard input only; the script and its tools don't inherit it.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | env -u SPARKLE_ED_PRIVATE_KEY scripts/make-update.sh \
            "https://github.com/$REPOSITORY/releases/download/$GITHUB_REF_NAME/Arbor-$version.zip"

      - name: No in-app update
        if: env.HAS_UPDATE_KEY != 'true'
        run: echo "::notice::SPARKLE_ED_PRIVATE_KEY is not set, so no update feed was made and this app has no updater"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 Arbor-*.dmg | tee "Arbor-${GITHUB_REF_NAME#v}.dmg.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          if [ "$HAS_CERTIFICATE" = "true" ]; then
            echo "Signed with a Developer ID and notarized by Apple." > "$notes"
          else
            {
              echo "**First launch:** this build isn't signed with an Apple Developer ID, so macOS blocks it the first time."
              echo "Open Arbor once, then go to System Settings → Privacy & Security and click **Open Anyway**."
              echo "On macOS 14 you can instead Control-click Arbor in Applications and choose **Open**."
            } > "$notes"
          fi
          # This version's section of CHANGELOG.md.
          { echo; awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md; } >> "$notes"
          assets=("build/Arbor-$version.dmg" "build/Arbor-$version.dmg.sha256")
          if [ "$HAS_UPDATE_KEY" = "true" ]; then assets+=("build/Arbor-$version.zip" "build/appcast.xml"); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag \
            --draft --title "Arbor $version" --notes-file "$notes"

      - name: Remove signing keychain
        if: always() && env.HAS_CERTIFICATE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
